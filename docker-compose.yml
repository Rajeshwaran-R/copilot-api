services:
  copilot-api:
    build: .
    ports:
      - "4141:4141"
    restart: always
    environment:
      - GH_TOKEN=${GH_TOKEN}
    # Health check validates Copilot API connection
    # Container restarts automatically if connection fails
    healthcheck:
      test: ["CMD", "curl", "-s", "-f", "http://localhost:4141/health"]
      interval: 30s      # Check every 30 seconds
      timeout: 10s       # 10 second timeout per check
      retries: 3         # Restart after 3 consecutive failures (~90 seconds)
      start_period: 10s  # Wait 10 seconds before first check
    deploy:
      restart_policy:
        condition: any
        delay: 5s
        window: 120s
      resources:
        limits:
          memory: 200m
